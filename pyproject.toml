[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-scatt-lab"
version = "0.1.0"
description = "Auditable SAXS/WAXS screening with optional grounded LLM interpretation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
polymer-scatt = "polymer_scatt.cli:main"

[tool.setuptools.package-data]
polymer_scatt = ["static/*.html"]

[tool.setuptools.packages.find]
include = ["polymer_scatt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
